<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player Profile | Softball Ready</title>
  <meta name="description" content="View a Softball Ready player profile.">
  <link rel="stylesheet" href="styles.css">

<style>
  .profile-shell{max-width:1180px;margin:0 auto}
  .profile-hero-card{display:grid;grid-template-columns:320px 1fr;gap:34px;align-items:center;background:linear-gradient(135deg,#102846,#17345f);color:#fff;border-radius:28px;padding:32px;box-shadow:0 18px 45px rgba(23,52,95,.18)}
  .profile-hero-photo{width:100%;height:360px;object-fit:contain;background:#f3f5f8;border-radius:22px}
  .profile-name{font-size:clamp(40px,6vw,72px);margin:0 0 12px;color:#fff}
  .profile-subtitle{font-size:22px;color:#e6edf7;margin:0 0 20px}
  .badge-row{display:flex;gap:10px;flex-wrap:wrap}
  .profile-badge{display:inline-flex;padding:9px 13px;border-radius:999px;font-weight:900;background:#fff;color:#17345f}
  .profile-badge.pink{background:#ef5d95;color:#fff}
  .profile-badge.soft{background:#dfe9f8;color:#17345f}
  .profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .profile-card{background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:24px;box-shadow:0 10px 26px rgba(23,52,95,.07)}
  .profile-card h3{margin-top:0}
  .profile-section{margin-top:30px}
  .profile-section h2{margin-bottom:14px}
  .profile-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .profile-gallery img{width:100%;height:270px;object-fit:contain;background:#f3f5f8;border-radius:18px}
  .profile-progress{height:12px;border-radius:999px;background:#e8edf5;overflow:hidden}
  .profile-progress > div{height:100%;background:linear-gradient(90deg,#ef5d95,#4f86d9)}
  .profile-stat{font-size:28px;font-weight:900;color:#17345f}
  .profile-muted{color:#6b7280}
  @media(max-width:850px){
    .profile-hero-card{grid-template-columns:1fr}
    .profile-hero-photo{height:300px}
    .profile-grid{grid-template-columns:1fr}
  }
</style>


<style>
  .pro-profile-shell{max-width:1180px;margin:0 auto}
  .pro-hero{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:36px;align-items:center;background:linear-gradient(135deg,#0d2246,#17345f 65%,#244f86);border-radius:30px;padding:34px;color:#fff;box-shadow:0 22px 55px rgba(13,34,70,.22)}
  .pro-hero-photo{width:100%;height:390px;object-fit:contain;background:#f2f5f9;border-radius:22px}
  .pro-name{font-size:clamp(42px,6vw,76px);line-height:.98;margin:8px 0 14px;color:#fff}
  .pro-subtitle{font-size:21px;line-height:1.5;color:#e5edf8;margin:0 0 20px}
  .pro-badges{display:flex;gap:9px;flex-wrap:wrap}
  .pro-badge{display:inline-flex;padding:9px 13px;border-radius:999px;font-size:14px;font-weight:900;background:#fff;color:#17345f}
  .pro-badge.pink{background:#ef5d95;color:#fff}
  .pro-badge.blue{background:#dfeafa;color:#17345f}
  .pro-progress{margin-top:25px}
  .pro-progress-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:900}
  .pro-progress-track{height:12px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden}
  .pro-progress-bar{height:100%;background:linear-gradient(90deg,#ff75aa,#fff);border-radius:999px}
  .pro-layout{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start;margin-top:28px}
  .pro-main{min-width:0}
  .pro-sidebar{position:sticky;top:100px}
  .pro-card{background:#fff;border:1px solid #e6eaf1;border-radius:22px;padding:25px;box-shadow:0 10px 28px rgba(23,52,95,.07);margin-bottom:22px}
  .pro-card h2,.pro-card h3{margin-top:0;color:#17345f}
  .pro-quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .pro-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pro-stat{background:#f8fafc;border:1px solid #e8edf4;border-radius:18px;padding:20px;text-align:center}
  .pro-stat-number{font-size:32px;font-weight:950;color:#17345f}
  .pro-stat-label{font-size:13px;color:#64748b;margin-top:5px}
  .pro-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
  .pro-gallery button{border:0;background:none;padding:0;cursor:pointer}
  .pro-gallery img{width:100%;height:245px;object-fit:contain;background:#f2f5f9;border-radius:17px;transition:transform .2s ease}
  .pro-gallery button:hover img{transform:scale(1.015)}
  .pro-contact{background:linear-gradient(145deg,#fff0f6,#ffffff);border:1px solid #ffd2e3}
  .pro-checklist{padding-left:20px;margin-bottom:0}
  .pro-checklist li{margin:8px 0}
  .pro-video-links{display:flex;gap:10px;flex-wrap:wrap}
  .pro-lightbox{position:fixed;inset:0;background:rgba(2,10,24,.88);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}
  .pro-lightbox.open{display:flex}
  .pro-lightbox img{max-width:min(1100px,95vw);max-height:90vh;object-fit:contain;background:#fff;border-radius:18px}
  .pro-lightbox-close{position:absolute;right:24px;top:20px;border:0;background:#fff;color:#17345f;width:44px;height:44px;border-radius:50%;font-size:25px;cursor:pointer}
  @media(max-width:920px){
    .pro-hero{grid-template-columns:1fr}
    .pro-hero-photo{height:330px}
    .pro-layout{grid-template-columns:1fr}
    .pro-sidebar{position:static}
    .pro-quick-grid,.pro-stat-grid{grid-template-columns:1fr}
  }
</style>

</head>
<body>
<header class="header"><div class="container nav">
  <a class="brand" href="index.html" aria-label="Softball Ready home"><div class="logo-mark">S<span>R</span></div><div class="brand-copy"><strong>SOFTBALL <span style="color:var(--pink)">READY</span></strong><small>The National Travel Softball Connection.</small></div></a>
  <button class="menu-btn" aria-expanded="false" aria-label="Open navigation">☰</button>
  <nav class="nav-links"><a href="index.html">Home</a><a href="players.html">Players</a><a href="teams.html">Teams</a><a href="coach-dashboard.html">Coach Dashboard</a><a href="player-search.html">Player Search</a><a href="membership.html">Membership</a></nav>
  <button class="btn btn-outline" type="button" data-logout>Log Out</button>
</div></header>

<main>
<section class="page-hero"><div class="container">
  <div class="eyebrow" style="color:#ff72a7">Player profile</div>
  <h1 data-profile-name>Loading Player Profile</h1>
  <p data-profile-summary>Checking your access and loading the profile...</p>
</div></section>

<section class="section"><div class="container">
  <div class="notice" data-profile-access-status>Loading...</div>
  <div class="pro-profile-shell" data-player-profile-view style="margin-top:24px"></div>
</div></section>
</main>
<div class="pro-lightbox" data-profile-lightbox aria-hidden="true">
  <button class="pro-lightbox-close" type="button" data-lightbox-close aria-label="Close photo">×</button>
  <img data-lightbox-image alt="Enlarged player photo">
</div>

<footer class="footer"><div class="container"><div class="footer-bottom"><div class="footer-motto">Where Opportunity Meets Preparation.</div><div>© 2026 Softball Ready. All rights reserved.</div></div></div></footer>
<script src="script.js"></script><script type="module" src="supabase-app.js"></script>
</body></html>

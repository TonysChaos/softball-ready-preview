<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player Profile | Softball Ready</title>
  <meta name="description" content="View a Softball Ready player profile.">
  <link rel="stylesheet" href="styles.css">

<style>
  .profile-shell{max-width:1180px;margin:0 auto}
  .profile-hero-card{display:grid;grid-template-columns:320px 1fr;gap:34px;align-items:center;background:linear-gradient(135deg,#102846,#17345f);color:#fff;border-radius:28px;padding:32px;box-shadow:0 18px 45px rgba(23,52,95,.18)}
  .profile-hero-photo{width:100%;height:360px;object-fit:contain;background:#f3f5f8;border-radius:22px}
  .profile-name{font-size:clamp(40px,6vw,72px);margin:0 0 12px;color:#fff}
  .profile-subtitle{font-size:22px;color:#e6edf7;margin:0 0 20px}
  .badge-row{display:flex;gap:10px;flex-wrap:wrap}
  .profile-badge{display:inline-flex;padding:9px 13px;border-radius:999px;font-weight:900;background:#fff;color:#17345f}
  .profile-badge.pink{background:#ef5d95;color:#fff}
  .profile-badge.soft{background:#dfe9f8;color:#17345f}
  .profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .profile-card{background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:24px;box-shadow:0 10px 26px rgba(23,52,95,.07)}
  .profile-card h3{margin-top:0}
  .profile-section{margin-top:30px}
  .profile-section h2{margin-bottom:14px}
  .profile-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .profile-gallery img{width:100%;height:270px;object-fit:contain;background:#f3f5f8;border-radius:18px}
  .profile-progress{height:12px;border-radius:999px;background:#e8edf5;overflow:hidden}
  .profile-progress > div{height:100%;background:linear-gradient(90deg,#ef5d95,#4f86d9)}
  .profile-stat{font-size:28px;font-weight:900;color:#17345f}
  .profile-muted{color:#6b7280}
  @media(max-width:850px){
    .profile-hero-card{grid-template-columns:1fr}
    .profile-hero-photo{height:300px}
    .profile-grid{grid-template-columns:1fr}
  }
</style>

</head>
<body>
<header class="header"><div class="container nav">
  <a class="brand" href="index.html" aria-label="Softball Ready home"><div class="logo-mark">S<span>R</span></div><div class="brand-copy"><strong>SOFTBALL <span style="color:var(--pink)">READY</span></strong><small>The National Travel Softball Connection.</small></div></a>
  <button class="menu-btn" aria-expanded="false" aria-label="Open navigation">☰</button>
  <nav class="nav-links"><a href="index.html">Home</a><a href="players.html">Players</a><a href="teams.html">Teams</a><a href="coach-dashboard.html">Coach Dashboard</a><a href="player-search.html">Player Search</a><a href="membership.html">Membership</a></nav>
  <button class="btn btn-outline" type="button" data-logout>Log Out</button>
</div></header>

<main>
<section class="page-hero"><div class="container">
  <div class="eyebrow" style="color:#ff72a7">Player profile</div>
  <h1 data-profile-name>Loading Player Profile</h1>
  <p data-profile-summary>Checking your access and loading the profile...</p>
</div></section>

<section class="section"><div class="container">
  <div class="notice" data-profile-access-status>Loading...</div>
  <div class="profile-shell" data-player-profile-view style="margin-top:24px"></div>
</div></section>
</main>

<footer class="footer"><div class="container"><div class="footer-bottom"><div class="footer-motto">Where Opportunity Meets Preparation.</div><div>© 2026 Softball Ready. All rights reserved.</div></div></div></footer>
<script src="script.js"></script><script type="module" src="supabase-app.js"></script>
</body></html>

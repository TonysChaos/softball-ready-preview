<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm Chad Floyd | SoftballReady.net™</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f5f7fb}.wrap{min-height:75vh;display:grid;place-items:center;padding:40px 18px}.card{width:min(680px,100%);background:#fff;border:1px solid #e4e8f0;border-radius:24px;padding:28px;box-shadow:0 18px 45px rgba(7,29,75,.08)}.card h1{margin:0 0 10px;color:var(--navy)}.card p{color:#667085;line-height:1.6}.detail{background:#f8fafc;border-radius:16px;padding:16px;margin:20px 0;color:var(--navy);font-weight:800}.status{margin-top:18px;font-weight:900;line-height:1.5}
</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">Owner-only account repair</div><h1>Confirm Chad Floyd's Email</h1><p>This confirms Chad's existing account without deleting it or changing his password.</p><div class="detail">Chad Floyd<br>chad.floyd@artech.com</div><button class="btn btn-pink" type="button" data-confirm disabled style="width:100%">Confirm Chad's Email</button><p class="status" data-status>Checking your admin session...</p></section></main>
<script type="module">
import { supabase } from "./supabase-config.js";
const button=document.querySelector("[data-confirm]"),status=document.querySelector("[data-status]");let session=null;
function show(msg,err=false){status.textContent=msg;status.style.color=err?"#b42318":"var(--navy)";}
async function init(){try{const {data,error}=await supabase.auth.getSession();if(error)throw error;session=data.session;if(!session){show("Log in as the SoftballReady owner/admin first.",true);return;}const {data:profile,error:pe}=await supabase.from("profiles").select("account_type").eq("id",session.user.id).single();if(pe)throw pe;if(String(profile?.account_type||"").toLowerCase()!=="admin"){show("This page is restricted to the SoftballReady owner/admin account.",true);return;}button.disabled=false;show("Admin verified. Press the pink button.");}catch(e){show(e.message||"Could not verify admin session.",true);}}
button.addEventListener("click",async()=>{if(!session)return;if(!confirm("Confirm chad.floyd@artech.com now?"))return;button.disabled=true;show("Confirming Chad's email...");try{const r=await fetch("/api/admin-confirm-chad",{method:"POST",headers:{"Authorization":`Bearer ${session.access_token}`,"Content-Type":"application/json"}});const result=await r.json().catch(()=>({}));if(!r.ok)throw new Error(result.error||"Confirmation failed.");show(result.alreadyConfirmed?`Chad was already confirmed. Confirmed at: ${result.confirmedAt||"confirmed"}`:`Success. Chad Floyd's email is confirmed${result.confirmedAt?` as of ${result.confirmedAt}`:""}. He can log in now.`);button.textContent="Chad Confirmed";}catch(e){button.disabled=false;show(e.message||"Could not confirm Chad.",true);}});
init();
</script></body></html>
